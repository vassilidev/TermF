description = "Frame → plan → implement → checks → rules → code review → security review → visual review → delivery"
max_parallel_agents = 4
budget_usd = 15

[steps.prd]
type = "agent"
role = "pm"
optional = true
enabled = false
prompt = "The request is a vague epic: write its short PRD before it is framed. Read the code if it helps; change nothing. Put the PRD in your report's summary; with a doubt that blocks the work, report status \"blocked\" with your questions."

[steps.frame]
type = "agent"
role = "po"
needs = ["prd"]
optional = true
prompt = "Turn the ticket into explicit acceptance criteria and an out-of-scope list. Read the code if it helps; change nothing. Put the criteria, the out-of-scope list and any doubt in your report's summary; with a doubt that blocks the work, report status \"blocked\" with your questions."

[steps.research]
type = "agent"
role = "researcher"
needs = ["frame"]
optional = true
enabled = false
prompt = "Research what the request depends on outside the repository: what exists, what the standards, APIs or libraries really say, what fits and what is known to fail. Several primary sources, each claim sourced and dated; when a choice must be made, at least two options with their trade-offs and your recommendation. Change nothing: put it in your report's summary."

[steps.competition]
type = "agent"
role = "competitive-analyst"
needs = ["frame"]
optional = true
enabled = false
prompt = "Map the competitors and alternatives of what the request builds: who does it, their features, public prices, positioning, strengths and weaknesses, public reviews, in a sourced comparison table, and what would set the project apart. \"Not found\" rather than an estimate. Change nothing: put it in your report's summary."

[steps.reverse]
type = "agent"
role = "reverse-engineer"
needs = ["frame"]
optional = true
enabled = false
prompt = "Work out how the software, API, format or site the request names behaves, for interoperability or to learn from it, within the legal frame of your role: state the legal ground first, then what you observed and how, point by point. Change nothing: put it in your report's summary."

[steps.architecture]
type = "agent"
role = "architect"
needs = ["frame", "research", "competition", "reverse"]
optional = true
enabled = false
prompt = "Settle the design decision the request depends on, before it is planned: the options, the decision you propose and the contracts the tasks will build on. Change nothing: put them in your report's summary."

[steps.ux]
type = "agent"
role = "ux"
needs = ["frame"]
optional = true
enabled = false
prompt = "Specify how the interface changes, before the work is planned: flows, every state, the components to reuse, accessibility. Change nothing: put the spec in your report's summary and the screens to review in affected_views."

[steps.plan]
type = "agent"
role = "lead"
needs = ["frame", "research", "competition", "reverse", "architecture", "ux"]

[steps.approve-plan]
type = "gate"
needs = ["plan"]

[steps.implement]
type = "foreach"
over = "plan.tasks"
needs = ["approve-plan"]

[steps.checks]
type = "shell"
needs = ["implement"]
run = "{{ repo.checks }}"

[steps.rules]
type = "rules"
needs = ["checks"]

[steps.review]
type = "review"
role = "reviewer"
needs = ["rules"]
prompt = "Review the run's changes (git diff of this branch against its base), the tests included. Change nothing: answer with your findings, each with the task that must fix it."

[steps.security]
type = "agent"
role = "secops"
needs = ["review"]
prompt = "Review the run's changes (git diff of this branch against its base) for vulnerabilities, abuse cases and vulnerable dependencies. Change nothing: put what you find in your report."

[steps.seo]
type = "agent"
role = "seo"
needs = ["review"]
optional = true
enabled = false
prompt = "Review the run's changes (git diff of this branch against its base) for search and web performance: metadata, structured data, social cards, Core Web Vitals. Change nothing, not even a file: put what you find, page by page, in your report."

[steps.migrations]
type = "review"
role = "dba"
needs = ["review"]
paths = ["**/migrations/**", "**/Migrations/**", "**/migration/**", "**/Migration/**", "**/db/migrate/**", "**/alembic/versions/**", "**/drizzle/**", "**/*.prisma", "**/schema.sql", "**/db/schema.rb", "**/db/structure.sql"]
prompt = "Review the database changes of the run (git diff of this branch against its base): each migration and schema file the tasks changed, and the code that calls them. Look for long locks on tables in use, a migration that cannot be rolled back, data that could be lost, a change the code running during the deploy would not survive, a missing index or constraint. Read them and run none: this folder is a throwaway copy without the run's database. Change nothing: answer with your findings, each with the task that must fix it."

[steps.visual]
type = "visual"
needs = ["review"]

[steps.update-base]
type = "update"
role = "integrator"
needs = ["security", "seo", "visual", "migrations"]

[steps.deliver]
type = "connector"
needs = ["security", "seo", "visual", "migrations", "update-base"]
actions = ["commit", "pull_request"]
