extends = "default"
description = "Small ticket (S) whose acceptance criteria are already testable, that one developer can do in one go, with no security stake: the CTO gives the one task at the triage; one developer codes, writes the tests and runs the checks, then one short review"

[steps.frame]
enabled = false

[steps.approve-plan]
enabled = false

[steps.review]
prompt = "A small ticket done by one developer: a short review. Look for what breaks an acceptance criterion of the ticket, a criterion left without a test, and any change the ticket does not need (a finding to undo); leave conventions and nits aside. Change nothing: answer with your findings, each with the task that must fix it."

[steps.security]
enabled = false
