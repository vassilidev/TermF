# A pod's (or a deployment's) last log lines.
name = "k8s-logs"
description = "The last log lines of a Kubernetes pod or deployment (deploy/web)"
mode = "read"
ai_access = "redacted"
approval = "always"
redact = ["email", "phone", "iban", "jwt", "vault_values"]

[params.pod]
type = "name"
description = "The pod, or deploy/<name> for one of a deployment's pods"
required = true

[params.container]
type = "name"
description = "The container, when the pod has several"

[params.since]
type = "duration"
description = "How far back, such as 15m, 1h or 2d"
default = "1h"

[params.grep]
type = "text"
description = "Only the lines that hold this text"

[params.lines]
type = "int"
description = "How many lines at most"
default = 200
min = 1
max = 2000

[limits]
lines = 2000
bytes = 262144
timeout_s = 30

[[run]]
kind = "kubernetes"
args = ["logs", "{pod}", "--timestamps", "--tail", "{lines}", "--since", "{since}", ["-c", "{container}"]]
keep = "{grep}"
