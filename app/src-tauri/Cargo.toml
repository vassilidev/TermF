[package]
name = "termf-app"
description = "TermF desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Unique lib name avoids a bin/lib name clash on Windows (cargo#8519).
name = "termf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
termf-agents = { path = "../../crates/termf-agents" }
termf-ci = { path = "../../crates/termf-ci" }
termf-core = { path = "../../crates/termf-core" }
termf-term = { path = "../../crates/termf-term" }
termf-files = { path = "../../crates/termf-files" }
termf-git = { path = "../../crates/termf-git" }
termf-library = { path = "../../crates/termf-library" }
termf-memory = { path = "../../crates/termf-memory" }
termf-schedule = { path = "../../crates/termf-schedule" }
termf-ssh = { path = "../../crates/termf-ssh" }
termf-sync = { path = "../../crates/termf-sync" }
termf-team = { path = "../../crates/termf-team" }
termf-tickets = { path = "../../crates/termf-tickets" }
termf-vault = { path = "../../crates/termf-vault" }
termf-worktree = { path = "../../crates/termf-worktree" }
termf-claude = { path = "../../crates/termf-claude" }
termf-onboarding = { path = "../../crates/termf-onboarding" }
termf-visual = { path = "../../crates/termf-visual" }
anyhow = "1.0.104"
tauri-plugin-global-shortcut = "2"
getrandom = "0.3.4"
interprocess = "2.4.9"
serde_json = "1.0.154"
tauri-plugin-notification = "2.8.1"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
keepawake = "0.6.1"

# Touch ID, through LocalAuthentication; these crates are already in the lockfile through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"

# Windows Hello, through UserConsentVerifier; the same `windows` crate as Tauri's.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3.2"
