# cargo audit (CI job `audit`): each advisory ignored here says why it does not apply to TermF.
[advisories]
ignore = [
  # rsa, Marvin timing attack on RSA decryption, no fixed version yet. TermF never decrypts with RSA: termf-ssh
  # only signs once to test a local key (docs/STATUS.md §4, SSH).
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5 (through elliptic-curve 0.13: p256, p384, p521), timing variability in operations meant to be
  # constant-time. TermF only uses these curves locally, when the user asks: SSH keys generated, converted or tested
  # once (termf-ssh), the vault's key agreement with a security key over USB (termf-vault); nothing signs or derives
  # on request from the network, so no one can time many operations. The fix needs elliptic-curve 0.14, which
  # ssh-key 0.6 does not take yet (docs/STATUS.md §4, Distribution).
  "RUSTSEC-2026-0387",
]

# The job audits advisories only, with the database it cloned (`--no-fetch`): a yanked crate is no vulnerability,
# and checking for one would need the crates.io index besides.
[yanked]
enabled = false
