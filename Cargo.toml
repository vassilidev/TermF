[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

# Dependency debug info is what makes target/ several GB; our crates keep line tables for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Unoptimized, generating an RSA key or deriving a key passphrase takes about a minute.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.bcrypt-pbkdf]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Same for the sync password's Argon2id (64 MiB).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
