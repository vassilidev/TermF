<!doctype html>
<!-- The share image of the site, site/og.png (1200x630). To make it again, from the repository root, with Chrome or Chromium:
     chrome --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 --screenshot=site/og.png site/og/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>TermF share image</title>
<style>
@font-face{font-family:"Instrument Sans";src:url(../fonts/instrument-sans.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 800}
/* The site's dark theme: graphite surfaces, solid titles, one quiet accent */
:root{--paper:#1a1a19;--sheet:#222221;--ink:#ededeb;--soft:#b6b5b0;--mute:#8f8e89;--line:rgb(255 255 255/.08);--accent:#9aa6e6;--done:#6cc58f}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Instrument Sans",sans-serif;-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;height:100%;padding:62px 72px 64px}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:650;letter-spacing:-.02em}
.brand img{width:48px;height:48px;filter:drop-shadow(0 1px 1px rgb(0 0 0/.4)) drop-shadow(0 12px 20px rgb(0 0 0/.5))}
h1{margin:40px 0 0;font-size:96px;line-height:1;font-weight:700;letter-spacing:-.04em}
h1 span{color:var(--accent)}
p{margin:24px 0 0;color:var(--soft);font-size:32px;font-weight:500;letter-spacing:-.015em}
/* The agent cards of the site */
.team{display:grid;grid-template-columns:repeat(3,auto);gap:16px;margin-top:auto}
.agent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:16px;border-radius:18px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.agent.on{box-shadow:inset 0 0 0 1px rgb(154 166 230/.6),0 0 0 4px rgb(154 166 230/.1)}
.ini{grid-row:1/3;display:grid;place-items:center;width:50px;height:50px;border-radius:14px;background:#2a2a28;box-shadow:inset 0 0 0 1px var(--line);font:600 15px/1 "JetBrains Mono",monospace}
b{font-size:20px;font-weight:600;white-space:nowrap}
code{grid-column:2/4;color:var(--mute);font:14px/1.2 "JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:600}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.working{background:rgb(154 166 230/.14);color:var(--accent)}
.working::before{width:10px;height:10px;background:none;border:1.8px solid currentColor;border-right-color:transparent}
.done{background:rgb(108 197 143/.13);color:var(--done)}
.queued{background:rgb(255 255 255/.05);color:var(--mute)}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="../icon.svg" alt="">TermF</div>
  <h1>Lead <span>a team</span> of<br>Claude Code agents.</h1>
  <p>A CTO plans. Specialists build and test. You approve.</p>
  <div class="team">
    <div class="agent"><span class="ini" style="color:#9aa6e6">CTO</span><b>CTO</b><span class="state done">Done</span><code>plans the ticket</code></div>
    <div class="agent on"><span class="ini" style="color:#86b8e2">BA</span><b>Back-end developer</b><span class="state working">Working</span><code>runs pytest tests/test_export.py</code></div>
    <div class="agent"><span class="ini" style="color:#6cc58f">RE</span><b>Code reviewer</b><span class="state queued">Queued</span><code>reads the whole diff</code></div>
  </div>
</main>
</body>
</html>
