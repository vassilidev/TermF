  "The plan gives each task a role and a size.",
  "TermF starts a fresh Claude Code session for the step, with the role's instructions and a brief: the task, the criteria, your answers, the earlier reports.",
  "The size sets the effort, medium, high or extra high, within the role's range; turns are capped at 60, 120 or 240.",
  "The step ends with a report in a fixed shape, and the next step starts from it.",
]
visual = "roster"
caption = "Some of the roles, with their model and effort. From library/roles."
default = [
  "Fourteen roles ship in <code>library/roles/</code>, each a Markdown file in the format of Claude Code's agents.",
  "Steps run in <code>acceptEdits</code> mode; the roles that only read cannot edit a file.",
  "secops runs at extra high effort.",
]
tune = [
  "<code>[roles.&lt;role&gt;]</code> for every project, one project, one squad or one repository: model, effort, range, permission mode, skills, preferences, write paths, denied tools (<code>+x</code> adds, <code>-x</code> removes).",
  "<code>[team] max_turns</code>.",
  "Write your own roles in the library.",
]
commands = [["termf team squads", "every role of a project with its settings and where each comes from"]]
limits = ["A repository can only pick a model or an effort and add to what is denied.", "The descriptions of the shipped roles are in English even in the French interface."]
