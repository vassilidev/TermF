problem = '''<p>An agent in a run should never push or open a pull request on its own. Every session of a run carries <code>termf guard</code>, a Claude Code hook that refuses those commands, and a run does not start without it.</p>'''
how = [
  "TermF starts each run session, team step and takeover with the guard as a <code>PreToolUse</code> hook.",
  "It refuses <code>git push</code>, <code>gh pr</code>, writes to GitHub issues and to CI, and <code>termf deliver</code>, <code>close</code> and <code>run</code>, also inside <code>sh -c</code>, <code>eval</code> and <code>$(…)</code>.",
  "The agent gets the reason, and tells you its work is ready.",
]
visual = "guard"
caption = "What an agent sees when it tries to push in a run. Sample data, the guard's own words."
default = ["On, for every run: it is not optional."]
tune = ["Nothing to set."]
commands = [["termf guard", "the hook itself; Claude Code calls it, not you"]]
limits = ["Defense in depth, not a sandbox: a script the agent writes and then runs, a git alias or another tool still pass.", "Managed settings that allow only managed hooks, or disable all hooks, would turn it off."]
tried = "Its refusal of <code>git -C . push</code> was checked with a real Claude Code 2.1.330."
related = ["delivery", "local-api", "security-input"]
read = "security.html#guard"

[[features]]
slug = "local-api"
group = "security"
name = "The isolated local API"
tagline = "A narrow key per session, and the actions that matter wait for you."
keywords = "api token capability confirmation banner cli socket"
problem = '''<p>Agents can run the <code>termf</code> command line, so the command line must not be a back door. Each session gets its own narrow key on TermF's local API, yours stays out of their reach, and the actions that matter wait for your confirmation in the app.</p>'''
how = [
  "Each terminal and each headless session gets its own token, revoked when it ends.",
  "Your own token lives outside the agents' folders and is denied to their tools.",
  "A reserved action from the command line shows a banner in the app: it waits for Allow, five minutes at most, and is dropped if the caller leaves.",
]
visual = "banner"
caption = "The banner a termf command raises before a reserved action. Sample data."
default = ["Confirmation on for starting a run or a team, delivering, closing, approving a gate, accepting a permission, typing into a session, opening an agent.", "Refused even if you confirm: an agent session without the guard, with all permissions bypassed, or with TermF's tools."]
tune = ["<code>[api] confirm_cli</code>, read at start."]
commands = [["termf deliver <run>", "an example of a command that waits for you"]]
limits = ["The banner cannot tell who asks: your command line and an agent running it look the same.", "A process set on it can still find the token file by a pattern, then use everything but the reserved actions."]
tried = "Checked with a real Claude Code that an agent cannot print its own token; the banner, with a simulated backend."
related = ["guard", "cli", "security-input"]
read = "security.html#api"

[[features]]
slug = "security-input"
group = "security"
name = "Secrets and untrusted input"
tagline = "Tickets are data, not orders; secrets stay out of the sessions."
keywords = "secrets env private keys untrusted prompt injection tickets local-first telemetry"
problem = '''<p>A ticket is written by someone else and may say anything. And a session should not read your <code>.env</code>. TermF frames every ticket as untrusted data, denies secrets to the sessions it starts, and keeps everything on your machine.</p>'''
how = [
  "A ticket reaches the agent as a framed file marked untrusted, never as instructions; earlier reports too.",
  "Every session TermF starts is denied <code>.env</code> files, private keys and environment dumps.",
  "The CTO's conversation reads the repositories but has no shell and no network.",
]
default = ["No TermF server, no telemetry: your code goes where Claude Code sends it, to the model, as it would without TermF."]
tune = ["Add to a role's <code>deny</code> list."]
commands = []
limits = ["The deny rules do not see every way around them, such as <code>python -c</code>, <code>sh -c</code> or a copy of the file.", "The tool sessions TermF runs for itself (scout, conventions, recipe, setup assistant) keep their own settings, without these denials."]
tried = "See the security page for what was verified, and how."
related = ["guard", "local-api", "vault"]
read = "security.html#input"

