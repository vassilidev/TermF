# ------------------------------------------------------------------------------------------------------------ projects

[[features]]
slug = "projects"
group = "projects"
name = "Projects and the setup"
tagline = "Pick your repositories; TermF reads them and proposes the rest."
keywords = "project new setup onboarding assistant trust repositories detection stack recommendations team conventions"
problem = '''<p>Setting up agents for a codebase means writing conventions, picking skills, wiring tickets and CI. Creating a project in TermF is a full-screen setup, one step per screen: you pick the repositories, TermF detects what they are made of and proposes the team, the ticket sources, the worktree recipe, CI and the skills, and you accept each one in a click.</p>'''
how = [
  "Press + next to Projects, or <kbd>⌘O</kbd>: the repositories of your machine come first, as cards sorted by activity, with their remote, branch, uncommitted changes and stack; search or filter, and pick one or several.",
  "The name comes from them (one repository, its name; several, their GitHub owner or their common folder); change it if you like.",
  "As you pick, TermF shows what it detects in each: stack and versions, dev, build, test and lint commands, CI, ticket sources, monorepo parts, database, tests and infrastructure.",
  "It proposes the team, the ticket sources, the worktree recipe, CI and the stack's skills; accept them, or set one aside to customise later.",
