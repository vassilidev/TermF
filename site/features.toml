[[features]]
slug = "budgets"
group = "team"
name = "Budgets, stop and take over"
tagline = "A run never spends without a limit, and you can step in at any time."
keywords = "budget cost dollars stop emergency takeover hand back pause terminal"
problem = '''<p>Agents left alone can loop and spend. Each run has a budget split across its steps, an emergency stop stops everything at once, and you can take any step's conversation into a terminal and hand it back.</p>'''
how = [
  "The run starts with its budget; each step gets the smaller of its own budget and its share of what is left.",
  "When it is spent, the agents stop and the run waits for you.",
  "Emergency stop interrupts the agents, stops them and kills their commands.",
  "Between two turns, Take over opens a step's conversation in a terminal with the same model and settings; Hand back returns it.",
]
default = [
  "15 dollars per run in the default workflow.",
  "After a restart, a working team is paused: nothing spends without you.",
  "Never two processes on one conversation.",
]
tune = ["The workflow's <code>budget_usd</code>, or the budget at launch.", "Change the run's budget when you change its path."]
commands = [["termf team stop [<run>]", "stop one team, or every team"], ["termf agent takeover <id>", "take a conversation into a terminal"], ["termf agent handback <id>", "give it back"]]
limits = ["A shell command started before a restart is not always killed.", "Take over is refused for the CTO and the expert, and once the budget is spent."]
tried = "Budgets and the emergency stop were tested with a fake Claude Code; taking over with the guard, by the code only."
related = ["runs", "cto", "terminals"]
read = "team.html#control"

