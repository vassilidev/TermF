problem = '''<p>On a project with several repositories or areas, one flat team steps on its own toes. Squads give each area its lead, its members and how many of each, its repositories, its paths and how many tasks it runs at once. The roles that serve every squad form the staff.</p>'''
how = [
  "Declare squads in the project's file, or accept the ones the setup assistant proposes.",
  "A run that spans one squad is planned by its lead; one that spans several is planned by the CTO, squad by squad.",
  "Each task stays inside its squad's repositories and paths, and the scheduler respects each squad's limits.",
]
visual = "squads"
caption = "Two squads and their limits in the project's Configuration. Sample data."
default = [
  "No squad declared: one implicit squad with every role and no limit, so nothing changes for a small project.",
]
