# ---------------------------------------------------------------------------------------------------------------- team

[[features]]
slug = "cto"
group = "team"
name = "The CTO's conversation"
tagline = "One agent you talk to, on every project's Home."
keywords = "chat assistant conversation home @role cards approval ask"
problem = '''<p>With several Claude Code sessions on several repositories, you end up being the one who relays everything. TermF gives each project one permanent conversation, with the CTO: you ask it where something lives, where a run is at, or for a piece of work in your own words, and it turns that into the right run for the team.</p><p>It is for anyone who would rather describe the work once than drive each agent by hand.</p>'''
how = [
  "You write to the CTO on the project's Home, or press <kbd>⌘⇧H</kbd> from anywhere.",
  "It reads the repositories, the runs, the tickets and what waits for you, then answers in place.",
  "When something needs doing, it asks through a card: start a team run, answer a question, approve a step, stop a run.",
  "You approve or deny the card; <code>@role</code> writes to a role at work and <code>@expert</code> to the project expert.",
]
visual = "conversation"
caption = "The CTO's conversation, with a plan to approve and a permission to grant. Sample data."
default = [
  "Reads with Read, Grep and Glob only; no shell, no network.",
  "Acts only through TermF's tools, and every action waits on your approval card.",
  "Each gate of a run wakes it for one turn, so it can tell you what the gate is about.",
  "Runs on opus at high effort.",
]
tune = [
  "Its model and effort: <code>[roles.cto]</code>.",
  "Switch the conversation to the expert with the CTO / Expert toggle.",
  "Every shortcut can be remapped.",
]
commands = [["termf team status <run>", "where a run is at, from any terminal"], ["termf team stop", "the emergency stop"]]
limits = [
  "The conversation has no budget of its own, and every gate costs it one turn.",
  "Notices waiting for it do not survive a restart of the app (they stay on screen).",
  "Text from tickets and agents reaches it as data; each action still waits on your card.",
]
tried = "Its tools were run with a real Claude Code (Haiku) through automated tests. The conversation in the app has been checked with a simulated backend."
related = ["triage", "home", "expert"]
read = "team.html#cto"

[[features]]
slug = "triage"
group = "team"
name = "Triage and the path"
tagline = "The CTO reads each request and picks how the team handles it."
keywords = "routing route workflow budget squads hotfix kind size"
problem = '''<p>A typo fix and an epic should not go through the same process. Before a team run starts, the CTO reads the request and the project and proposes the path: what kind of work it is, how big, which workflow, which optional steps, which squads, what budget. You approve it before anything starts.</p>'''
how = [
  "The run starts with a triage step, the CTO on opus.",
  "It returns the kind (bug, feature, epic, refactor, infra, SEO, docs…), the size (S, M, L), the workflow, the steps to add or skip, the effort per step, the squads and the budget, with its rulings and their reasons.",
  "If something is unclear, it asks its questions first, with proposed answers.",
  "TermF checks everything it proposed, then the path waits for you: Approve the path, Change or Refuse.",
]
visual = "path"
caption = "The path as the run shows it, before anything starts. Sample data."
default = [
  "On for every team run, and the path waits for your approval.",
  "The <code>hotfix</code> workflow applies its path at once; if the CTO routes a default launch to a workflow with fewer gates, the gate opens anyway.",
  "The CTO's budget advice can only lower the run's budget.",
]
tune = [
  "<code>[team] triage</code> and <code>approve_route</code>, per project or for every project.",
  "Change the path before approving: workflow, optional steps, squads, run budget.",
]
commands = [["termf team route <run>", "the decision, its reason, steps, squads and budget"], ["termf team run --request <text>", "start the team on a request written in your own words"]]
limits = ["Every gate wakes the CTO for one turn: a cost to know about."]
tried = "The triage ran with a real Claude Code (Haiku) through automated tests; the gate in the app was checked with a simulated backend."
related = ["cto", "questionnaire", "workflows"]
read = "how-it-works.html#triage"

[[features]]
slug = "questionnaire"
group = "team"
name = "Questions with proposed answers"
tagline = "When an agent has doubts, you get a form, already filled in."
keywords = "questions answers form doubts clarification po plan"
problem = '''<p>Agents that guess get things wrong; agents that ask in a wall of text waste your time. In TermF, the triage, the product owner, the plan or any blocked step ask in one form: each question has a theme, the reason it is asked, its options and a proposed answer. You only change what does not suit you.</p>'''
how = [
  "An agent reports questions instead of guessing, each with a theme, a reason, options and a proposed answer.",
  "The run stops on a card in the run and on the Home; the proposed answers are already selected.",
  "You change what is wrong, add another answer or a note, and send them all at once, or answer in free text.",
  "The step runs again with your answers, and they travel into every later brief of the run.",
]
visual = "questionnaire"
caption = "The plan has questions; the proposed answers are filled in. Sample data."
default = [
  "One mechanism for the triage, the product manager, the product owner, the plan and any blocked step.",
  "Questions are grouped by theme: product, scope, interface, technical, security, delivery.",
]
tune = ["Answer in the app, or from a terminal with <code>termf team answer</code>."]
commands = [["termf team answer <run> <step> <id>=<answer>…", "answer a step's questions"], ["termf team status <run>", "each question with its reason, options and proposal"]]
limits = ["The review's questions are written in English for the CTO and the API, and shown translated in the French interface."]
tried = "Run with a real Claude Code (Haiku) through the triage; the form was checked with a simulated backend."
related = ["triage", "roles", "runs"]
read = "how-it-works.html#questions"

