[[features]]
slug = "code-review"
group = "team"
name = "Code review and security review"
tagline = "Each finding goes back to the task that owns it."
keywords = "review reviewer secops security owasp findings rounds nits"
problem = '''<p>An agent reviewing its own work is not a review. In every run, a reviewer reads the integrated diff against the criteria, the contracts between tasks and the project's conventions, and sends each finding back to the task that must fix it. Then the security reviewer goes over the same diff.</p>'''
how = [
  "After the tasks and the checks, the reviewer reads the run's whole diff; each finding has its file and line, the scenario that breaks and the fix.",
  "Important findings go back to their task in a fresh session; the reviewer looks again, up to two rounds.",
  "A finding with no clear owner, or still open after the last round, becomes a question for you.",
  "secops reviews the diff for vulnerabilities, abuse cases and dependencies, in two passes: find, then confirm.",
]
visual = "workflow"
caption = "Review and security come after the tasks and the checks, in the default workflow."
default = [
  "On, up to two rounds; the CTO cannot skip it.",
  "Nits are reported, not fixed.",
  "secops runs on opus at extra high effort, citing the OWASP Top 10 categories.",
]
tune = ["<code>[team] review</code>, <code>review_rounds</code> (1 to 10), <code>review_nits = \"report\" | \"fix\"</code>."]
commands = [["termf team events <run>", "the run's events, the review rounds included"]]
limits = ["A finding is tied to a task by its id or by the role of a single task, never by its file.", "The reviewer is asked to check each finding on its own; TermF does not check them."]
tried = "The review loop ran with a real Claude Code (Haiku), clean on its first round, through automated tests."
related = ["roles", "workflows", "visual-review"]
read = "how-it-works.html#review"

