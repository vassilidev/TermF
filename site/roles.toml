# The team as the website shows it: readable names and groups for the roles in library/roles/. The model, the effort and
# the permissions come from each role's frontmatter; .github/scripts/features.py reads both, so the roster and its count
# follow the library. A role missing here still shows, in the last group, with its own description.

[[groups]]
id = "contact"
name = "The CTO and the expert"
intro = "The CTO is your one point of contact. The expert answers your questions about the project."
color = "cto"

[[groups]]
id = "product"
name = "Product and design"
intro = "They settle what to build and how it should work, before any code."
color = "product"

[[groups]]
id = "build"
name = "Plan and build"
intro = "The lead plans the tasks; the builders write the code, each in its own copy of the repository."
color = "build"

[[groups]]
id = "quality"
name = "Quality and security"
intro = "They check the work before it reaches you, and send each problem back to the task that made it."
color = "quality"

[[groups]]
id = "creative"
name = "Brand, words and video"
intro = "They join a run when a ticket asks for an identity, words or a video."
color = "creative"

[[groups]]
id = "specialists"
name = "Specialists"
intro = "One field each. The plan brings them in when a ticket touches it; the database engineer also reviews every migration."
color = "specialists"

[roles.cto]
label = "CTO"
mark = "CTO"
group = "contact"
short = "Your one point of contact"
does = "Reads each request, decides how the team takes it on, and brings back what the team needs from you."
when = "First, on every request: it triages the run, and plans the squads' work when there are several."
never = "Writes code or edits a file: it only reads the repositories."

[roles.expert]
label = "Project expert"
group = "contact"
short = "Answers about the project"
does = "Answers questions about the project, how a part works, why, where it lives, what was decided, with its sources."
when = "When you switch the Home's conversation to Expert, and when the CTO, the product owner, the product manager or the architect has a doubt."
never = "Edits a file, runs a command or browses the web. It is never given a task."

[roles.pm]
label = "Product manager"
group = "product"
short = "Writes the PRD of a vague epic"
does = "Turns a vague request into a short PRD: the problem, measurable goals, non-goals, risks, and questions for you."
when = "Before the product owner, for a vague epic. Optional."
never = "Touches code, the ticket or the acceptance criteria."

[roles.po]
label = "Product owner"
group = "product"
short = "Frames the ticket"
does = "Frames the ticket before any work: testable acceptance criteria with their source, what is out of scope, and a questionnaire for what is left open."
when = "On every run, right after the triage. Skipped when the ticket already lists testable acceptance criteria, or for an obvious urgent fix."
never = "Touches code, or changes the ticket without your approval."

[roles.ux]
label = "UX designer"
group = "product"
short = "Specifies flows and states"
does = "Specifies how the change looks and behaves: flows, screens, every state, keyboard and screen reader."
when = "When the interface changes and the ticket gives no design: before the plan, or before the front-end tasks."
never = "Writes code, or invents visible text the ticket did not give."

[roles.architect]
label = "Architect"
group = "product"
short = "Settles design decisions"
does = "Settles a design decision: options with their trade-offs, a proposed decision, and the contracts the other tasks build on."
when = "For a large task or a decision that crosses modules or squads: before the plan, or first in it."
never = "Writes code. Not called for a change that fits one module's existing design."

[roles.researcher]
label = "Researcher"
mark = "RES"
group = "product"
short = "Researches the web, sources it all"
does = "Answers what the code cannot: what exists, what a standard or an API really says, which approach fits. Several primary sources, each claim dated, options with their trade-offs."
when = "At the start of a new project, and when a request asks for a study or a choice to settle."
never = "Changes a file, or states a figure it could not source: it says \"not found\"."

[roles.competitive-analyst]
label = "Competitive analyst"
mark = "CMP"
group = "product"
short = "Maps competitors and alternatives"
does = "Compares who else solves the problem: features, public prices, positioning, strengths and weaknesses, public reviews, in a sourced table, and what would set the project apart."
when = "At the start of a new project, and when a request asks who else does it."
never = "Changes a file, or fills a cell without a source: it says \"not found\"."

[roles.reverse-engineer]
label = "Reverse engineer"
mark = "REV"
group = "product"
short = "Works out how existing software behaves"
does = "Describes how an existing product, API, file format or site works, to interoperate with it or learn from it: its code, its network traffic, its files, each point with how it was observed."
when = "When the project must work with something that has no documentation, or learn how others do it."
never = "Bypasses a protection or a DRM, breaks terms of use or a licence, uses access it was not given, or touches personal data."

[roles.lead]
label = "Tech lead"
group = "build"
short = "Plans the tasks"
does = "Turns the ticket into a plan of tasks per role, each with its files, the criteria it covers and its dependencies."
when = "After the framing, on every run, and again when a step fails or a question blocks."
never = "Edits a file, or takes a task itself."

[roles.front]
label = "Front-end developer"
group = "build"
short = "Builds the interface"
does = "Builds screens, components, styles and client-side logic, with accessibility."
when = "For interface work, after the UX designer when there is no design."
never = "Changes metadata or social cards (the SEO engineer's job), or text the ticket did not ask for."

[roles.back]
label = "Back-end developer"
group = "build"
short = "Builds the API and the data"
does = "Builds the API, business logic, database and migrations, with their tests."
when = "For server work."
never = "Touches CI, infrastructure or dependency upgrades (DevOps), or screens (front)."

[roles.devops]
label = "DevOps engineer"
group = "build"
short = "CI, infrastructure, dependencies"
does = "Changes CI/CD pipelines, infrastructure as code, builds and dependencies, with the smallest change that works."
when = "For CI, infrastructure, build and dependency work."
never = "Touches application code or its tests."

[roles.seo]
label = "SEO engineer"
mark = "SEO"
group = "build"
short = "Search, sharing and speed"
does = "Metadata, sitemaps, structured data, social cards and their images, Lighthouse and Core Web Vitals."
when = "When the ticket changes public pages."
never = "Changes a page's content or layout, or any text the ticket did not give."

[roles.qa]
label = "QA engineer"
group = "quality"
access = "Writes tests only"
short = "Proves each criterion"
does = "Checks every acceptance criterion on the merged work, with evidence, and adds the missing regression tests."
when = "Last in a medium or large plan, once the code tasks are done."
never = "Changes production code, CI, or an existing test's assertions."

[roles.reviewer]
label = "Code reviewer"
group = "quality"
short = "Reviews the whole change"
does = "Reviews the run's whole diff against the criteria, the contracts and the project's conventions; each finding goes back to the task that must fix it."
when = "On every run, after the tasks and the checks, for up to two rounds."
never = "Edits a file: the task that made the problem fixes it."

[roles.secops]
label = "Security reviewer"
mark = "SEC"
group = "quality"
short = "Looks for vulnerabilities"
does = "Reviews the run's diff for vulnerabilities, abuse cases and vulnerable dependencies, in two passes: find, then confirm."
when = "On every run, after the code review."
never = "Edits a file: the developers fix what it finds."

[roles.integrator]
label = "Merge integrator"
mark = "IN"
group = "quality"
short = "Brings in the latest base"
does = "When the main branch moved on during the run and merging it conflicts, resolves each conflict so the result does what both sides meant; the checks and the code review then read the merge."
when = "Just before the delivery, only when the base branch changed and the merge conflicts; again on demand if the pull request falls behind."
never = "Takes a task from the plan, or resolves a conflict between the run's own tasks (their agents do)."

[roles.brand]
label = "Brand designer"
group = "creative"
short = "Logo, guidelines, design system"
does = "Makes the visual identity: a logo and its variants, guidelines in PDF, the design system as code, and every export."
when = "When a ticket asks for an identity."
never = "Builds screens and features, or writes product text the ticket did not give."

[roles.copy]
label = "UX writer"
group = "creative"
short = "Interface text and docs"
does = "Writes the words the ticket asks for: interface text, pages, README, glossary, in every language the project ships."
when = "When a ticket asks for words."
never = "Rewords existing text the ticket does not name, or changes layout and code."

[roles.motion]
label = "Motion designer"
group = "creative"
short = "Videos and animations"
does = "Makes launch videos, product demos, animations and GIFs, from a storyboard you approve first."
when = "When a ticket asks for a video or an animation."
never = "Touches the product's code or the app's own transitions."

[roles.dba]
label = "Database engineer"
mark = "DBA"
group = "specialists"
short = "Schema, migrations, queries"
does = "Keeps the schema sound: tables, constraints and indexes, migrations that are reversible and safe on a live database, queries read in their execution plans."
when = "When the plan gives it the schema, and as a review step on every run that changes a migration."
never = "Touches the API and business logic around the data (back), database servers and hosting (DevOps), or any database but the run's own."

[roles.docs]
label = "Technical writer"
mark = "DOC"
group = "specialists"
short = "README, API docs, changelog"
does = "Writes the documentation the ticket asks for: README, API reference, changelog, guides, the decision log and the conventions the other agents read."
when = "When a ticket asks for documentation."
never = "Writes the words of the interface (copy), or rewords docs the ticket does not name."

[roles.integrations]
label = "Integration engineer"
mark = "INT"
group = "specialists"
short = "Payments, SSO, webhooks"
does = "Connects the product to outside services, payments, single sign-on, outside APIs and webhooks, with idempotency, retries, signature checks and the provider's test mode."
when = "When a ticket connects the product to a third-party service."
never = "Touches the project's own API and business logic (back), the infrastructure (DevOps), or a real account or production endpoint of the provider."

[roles.sre]
label = "Site reliability engineer"
mark = "SRE"
group = "specialists"
short = "Monitoring, alerts, load tests"
does = "Makes the service observable and reliable: logs, metrics and traces, service level objectives and alerts, load tests, post-mortems."
when = "For performance and reliability work."
never = "Touches CI, infrastructure and deployments (DevOps), or any production system or real credentials."

[roles.a11y]
label = "Accessibility auditor"
mark = "A11Y"
group = "specialists"
short = "Audits WCAG and RGAA"
does = "Audits the changed screens against WCAG 2.2 AA and the RGAA, keyboard, screen readers, contrast, zoom, responsive layouts and browsers, with evidence for each finding."
when = "After the front-end tasks, on the screens they changed."
never = "Changes a file: the front-end developer fixes what it finds."

[roles.ai]
label = "AI engineer"
mark = "AI"
group = "specialists"
short = "Prompts, RAG, evaluations"
does = "Makes the product's use of language models measurably good: prompts and structured outputs, retrieval, evaluations, token costs and caching, the choice of model."
when = "When the product calls language models."
never = "Touches the product's code that does not call a model, or any real API key or paid account."

[roles.analytics]
label = "Product analyst"
mark = "AN"
group = "specialists"
short = "Events, funnels, dashboards"
does = "Makes the product measurable: the tracking plan, events sent with the project's analytics SDK after the user's consent, funnels and KPI dashboards."
when = "When a ticket needs a tracking plan."
never = "Touches server logs, metrics and alerts (SRE), the legal reading of consent (compliance), or a real analytics account."

[roles.legal]
label = "Compliance analyst"
mark = "LAW"
group = "specialists"
short = "Terms, privacy, consent"
does = "Says what the law asks of the change, terms of use, privacy and the GDPR, cookies and consent, mandatory notices, sector rules, each point sourced from an official text and to be checked by a legal professional."
when = "When a ticket touches what the law asks of the product."
never = "Changes a file: copy or docs write the pages it advises on."
