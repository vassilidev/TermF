name: Release

# A version tag (v0.2.0, v0.3.0-beta.1…) builds the installers for every platform into a draft GitHub release,
# which the maintainer publishes; a tag with a hyphen is a pre-release, which only the beta channel takes. Run by
# hand, it builds into a draft of its own, v<version>-dispatch.<run>, never into a published release.
# With the TAURI_SIGNING_PRIVATE_KEY secret, the update packages and latest.json come along; without it the build
# goes on, and the summary says installed copies will not be offered this release. Procedure: docs/STATUS.md §5.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      signed: ${{ steps.meta.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag is not the app's version v$version (app/src-tauri/tauri.conf.json)"
              exit 1
            fi
          else
            tag=v$version-dispatch.$GITHUB_RUN_NUMBER
          fi
          case $tag in *-*) prerelease=true ;; *) prerelease=false ;; esac
          signed=false
          [ -z "$KEY" ] || signed=true
          { echo "tag=$tag"; echo "prerelease=$prerelease"; echo "signed=$signed"; } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rust: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: x86_64-apple-darwin
          # One .dmg for both processors; the updater keeps the smaller per-processor packages above.
          - os: macos-latest
            target: universal-apple-darwin
            rust: aarch64-apple-darwin,x86_64-apple-darwin
            universal: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      # macOS: with the DEVELOPER_ID_P12 secret, Tauri signs the app and the .dmg with that Developer ID; without
      # it, ad hoc (bundle.macOS.signingIdentity "-"). Tauri gets no Apple ID, so notarizing is the step after it.
      - name: Developer ID
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No DEVELOPER_ID_P12 secret: the macOS app is signed ad hoc, not notarized."
            exit 0
          fi
          cert=$(printf %s "$P12" | tr -d '\r\n ')
          echo "::add-mask::$cert"
          # Matches the imported certificate, and replaces the ad hoc "-" of tauri.conf.json.
          { echo "APPLE_CERTIFICATE=$cert"; echo "APPLE_CERTIFICATE_PASSWORD=$P12_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application"; } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # On CI the bundler skips the Finder step that lays out the .dmg (background, icon positions) unless told not to.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          projectPath: app
          tauriScript: pnpm tauri
          # The bundle config also builds and ships the `termf` CLI next to the app; the updater one adds the
          # signed update packages.
          args: >-
            --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
            ${{ needs.meta.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: TermF ${{ needs.meta.outputs.tag }}
          releaseBody: Draft. The notes come from CHANGELOG.md when it is published.
          releaseDraft: true
          prerelease: ${{ needs.meta.outputs.prerelease }}
          includeUpdaterJson: ${{ !matrix.universal }}
          updaterJsonPreferNsis: true
      # Apple usually takes minutes, sometimes hours: a .dmg still waiting after 30 minutes leaves the release and
      # is kept as an artifact, and notarized.yml puts it back, stapled, once Apple accepts it.
      - name: Notarize the .dmg
        id: notarize
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -z "$NOTARY_APPLE_ID" ]; then
            echo "::warning::No NOTARY_APPLE_ID secret: the .dmg is signed, not notarized."
            exit 0
          fi
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          name=$(basename "$dmg")
          auth=(--apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD")
          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json | jq -r .id)
          xcrun notarytool wait "$id" "${auth[@]}" --timeout 30m > /dev/null || true
          status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r .status)
          case $status in
            Accepted)
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              gh release upload "$TAG" "$dmg" --clobber -R "$GITHUB_REPOSITORY" ;;
            "In Progress")
              echo "::warning::Apple is still notarizing $name: notarized.yml puts it back in $TAG once Apple accepts it."
              gh release delete-asset "$TAG" "$name" -y -R "$GITHUB_REPOSITORY"
              mkdir pending && cp "$dmg" pending/ && echo "$id" > pending/notary-id && echo "$TAG" > pending/tag
              echo "pending=true" >> "$GITHUB_OUTPUT" ;;
            *)
              xcrun notarytool log "$id" "${auth[@]}" || true
              echo "::error::Apple did not notarize $name ($status)"
              exit 1 ;;
          esac
      - name: Keep the .dmg for notarized.yml
        if: steps.notarize.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: pending/
          if-no-files-found: error

  # Once every build is in: SHA256SUMS for the install scripts, and what the updater will see.
  checksums:
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      SIGNED: ${{ needs.meta.outputs.signed }}
    steps:
      - name: SHA256SUMS
        run: |
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$TAG" dist/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
          { echo "### $TAG"; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Updater
        run: |
          if [ "$SIGNED" != true ]; then
            msg="No TAURI_SIGNING_PRIVATE_KEY secret: built without update packages nor latest.json, so installed copies of TermF will not be offered $TAG."
            echo "::warning::$msg"
            printf '\n> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=
          # The plain keys, then one per installer: a .deb or .rpm install only takes its own (tauri-cli signs both).
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64 \
            windows-x86_64-nsis windows-aarch64-nsis linux-x86_64-deb linux-x86_64-rpm linux-aarch64-deb linux-aarch64-rpm; do
            jq -e --arg p "$p" '.platforms[$p]' dist/latest.json > /dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            msg="latest.json has no update for:$missing (that build failed, or two builds wrote latest.json at once: rerun that build)."
            echo "::warning::$msg"
            printf '\n> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "latest.json covers every platform." >> "$GITHUB_STEP_SUMMARY"
          fi
