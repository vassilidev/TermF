name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the older run of the same pull request, or of main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The owner's platform is macOS: main runs there, pull requests get one quick Linux run.
# Windows and Linux packages are still built by release.yml.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: AppStream metadata of the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y appstream
          appstreamcli validate --no-net --explain app/src-tauri/installer/dev.termf.app.metainfo.xml
      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The e2e bridge only builds with its feature: checked on the quick Linux run of the pull requests.
      - if: runner.os == 'Linux'
        run: cargo clippy -p termf-app --all-targets --features e2e -- -D warnings
      - run: cargo test --workspace

  # The real app (debug build) driven by tauri-driver under xvfb, and the performance budgets of ARCHITECTURE §2.4.
  # Not on macOS (no WebDriver for its webview), not yet on Windows (docs/STATUS.md §4).
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
          sudo locale-gen en_US.UTF-8 fr_FR.UTF-8
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build the app and the CLI (debug)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --debug --no-bundle
          cargo build -p termf-cli
      - name: End-to-end scenarios and performance
        working-directory: app
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: app/e2e/out/
          if-no-files-found: ignore

  # The performance budgets on the product itself: the release build, measured like the debug one in the e2e job.
  perf-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-release
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
          sudo locale-gen en_US.UTF-8 fr_FR.UTF-8
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build the app (release)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle
      - name: Performance
        working-directory: app
        env:
          TERMF_E2E_APP: ${{ github.workspace }}/target/release/termf-app
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm e2e perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-release-linux
          path: app/e2e/out/
          if-no-files-found: ignore

  # The same scenarios on macOS, where no WebDriver exists: the app's e2e build drives its window through its bridge.
  e2e-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Build the e2e app and the CLI (debug)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm e2e:build
      - name: End-to-end scenarios and performance
        working-directory: app
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-macos
          path: app/e2e/out/
          if-no-files-found: ignore

  # site/install.sh and site/install.ps1, run dry against a fake GitHub API, then one real install in a throwaway home.
  install-scripts:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON('["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh .github/scripts/install-test.sh
        shell: bash

  # A known vulnerability fails, unless .cargo/audit.toml ignores it with its reason; an advisory database out of
  # reach only warns. npm advisories are reported, never blocking.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - id: db
        continue-on-error: true
        run: git clone --depth 1 https://github.com/rustsec/advisory-db.git ~/.cargo/advisory-db
      - if: steps.db.outcome == 'success'
        run: cargo audit --no-fetch
      - if: steps.db.outcome != 'success'
        run: |
          echo "::warning::RustSec advisory database out of reach, cargo audit skipped"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: pnpm audit (informative)
        working-directory: app
        run: |
          pnpm audit --prod || echo "::warning::pnpm audit --prod reports advisories (informative), see this step's log"
