name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The real app (debug build) driven by tauri-driver, and the performance budgets of ARCHITECTURE §2.4.
  # macOS has no WebDriver for its webview.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
          sudo locale-gen en_US.UTF-8 fr_FR.UTF-8
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      # The driver must match the WebView2 runtime, or the session hangs; the tool downloads that version.
      - name: Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\msedgedriver" | Out-Null
          Set-Location "$env:RUNNER_TEMP\msedgedriver"
          msedgedriver-tool
          $PWD.Path >> $env:GITHUB_PATH
      - name: Build the app and the CLI (debug)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --debug --no-bundle
          cargo build -p termf-cli
      - name: End-to-end scenarios and performance
        working-directory: app
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a --server-args="-screen 0 1920x1080x24"' || '' }} pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: app/e2e/out/
          if-no-files-found: ignore

  # site/install.sh and site/install.ps1, run dry against a fake GitHub API, then one real install in a throwaway home.
  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh .github/scripts/install-test.sh
        shell: bash

  # A known vulnerability fails, unless .cargo/audit.toml ignores it with its reason; an advisory database out of
  # reach only warns. npm advisories are reported, never blocking.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - id: db
        continue-on-error: true
        run: git clone --depth 1 https://github.com/rustsec/advisory-db.git ~/.cargo/advisory-db
      - if: steps.db.outcome == 'success'
        run: cargo audit --no-fetch
      - if: steps.db.outcome != 'success'
        run: |
          echo "::warning::RustSec advisory database out of reach, cargo audit skipped"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: pnpm audit (informative)
        working-directory: app
        run: |
          pnpm audit --prod || echo "::warning::pnpm audit --prod reports advisories (informative), see this step's log"
