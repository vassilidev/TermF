[package]
name = "termf-team"
description = "The agent team of a ticket run: sessions per role, the orchestrator's plan, the workflow engine with its gates and budgets, and the rules checked at the end of each step"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termf-agents = { path = "../termf-agents" }
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-term = { path = "../termf-term" }
termf-tickets = { path = "../termf-tickets" }
termf-worktree = { path = "../termf-worktree" }
toml = "1.2.2"
