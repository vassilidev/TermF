[package]
name = "termf-cli"
description = "termf: drive TermF from any terminal, and the hook Claude Code sessions report through"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "termf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
interprocess = "2.4.9"
rpassword = "7.5.5"
serde_json = "1.0.154"
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-ssh = { path = "../termf-ssh" }
termf-sync = { path = "../termf-sync" }
termf-tickets = { path = "../termf-tickets" }
termf-worktree = { path = "../termf-worktree" }
