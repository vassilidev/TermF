[package]
name = "termf-cli"
description = "termf: drive TermF from any terminal, and the hook Claude Code sessions report through"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "termf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
interprocess = "2.4.9"
# Says when a scheduled task run while TermF is closed ends; already built for the app's notifications.
notify-rust = "4.19.0"
rpassword = "7.5.5"
serde_json = "1.0.154"
termf-agents = { path = "../termf-agents" }
termf-ci = { path = "../termf-ci" }
termf-claude = { path = "../termf-claude" }
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-memory = { path = "../termf-memory" }
termf-ops = { path = "../termf-ops" }
termf-schedule = { path = "../termf-schedule" }
termf-ssh = { path = "../termf-ssh" }
termf-sync = { path = "../termf-sync" }
termf-team = { path = "../termf-team" }
termf-tickets = { path = "../termf-tickets" }
termf-vault = { path = "../termf-vault" }
termf-visual = { path = "../termf-visual" }
termf-worktree = { path = "../termf-worktree" }
