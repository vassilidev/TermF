[package]
name = "termf-sync"
description = "Encrypted sync of the TermF config between a user's machines, through git, a folder, S3 or WebDAV"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
hmac = "0.12.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-ssh = { path = "../termf-ssh" }
toml = "1.2.2"
toml_edit = "0.25"
zeroize = "1"
