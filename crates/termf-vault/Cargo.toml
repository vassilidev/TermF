[package]
name = "termf-vault"
description = "The vault: encrypted secrets by scope, references to external managers, unlock and auto-lock, masking, hash-chained audit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
termf-claude = { path = "../termf-claude" }
termf-core = { path = "../termf-core" }
termf-sync = { path = "../termf-sync" }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
