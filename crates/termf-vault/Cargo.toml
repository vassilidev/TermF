[package]
name = "termf-vault"
description = "The vault: encrypted secrets by scope, references to external managers, unlock and auto-lock, masking, hash-chained audit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8.4"
anyhow = "1.0.104"
cbc = "0.1.2"
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
termf-claude = { path = "../termf-claude" }
termf-core = { path = "../termf-core" }
termf-sync = { path = "../termf-sync" }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Security keys over USB HID. Without libudev on Linux: nothing to install to build it.
[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

# Windows lets only its WebAuthn API reach a security key.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"] }
