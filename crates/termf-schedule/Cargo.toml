[package]
name = "termf-schedule"
description = "Scheduled Claude Code tasks: cron schedules, their runs and history, and the system scheduler entries that run them while TermF is closed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
# Local time with its daylight saving rules on every system (Windows has no time zone database to read).
jiff = "1.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-sync = { path = "../termf-sync" }
termf-term = { path = "../termf-term" }
toml = "1.2.2"
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
