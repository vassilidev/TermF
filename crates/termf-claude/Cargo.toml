[package]
name = "termf-claude"
description = "Claude Code on this machine: an overview of its whole config, settings edits, and the index of the account's claude.ai artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: a setting saved by TermF keeps the file's key order, so its diff shows only the change.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
termf-core = { path = "../termf-core" }
yaml-rust2 = "0.13.2"
