[package]
name = "termf-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The seeded generator of the property tests, for other crates' dev-dependencies only.
test-util = []

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
toml_edit = "0.25"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Only to check the rules TermF writes for Gemini CLI; already in Cargo.lock.
[dev-dependencies]
regex = "1.13.2"
