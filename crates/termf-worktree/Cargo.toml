[package]
name = "termf-worktree"
description = "Stack-aware worktree setup: detection, the project's recipe, dependencies, local files, a database copy and ports per worktree"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
toml = "1.2.2"
yaml-rust2 = "0.13.2"

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
