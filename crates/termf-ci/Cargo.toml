[package]
name = "termf-ci"
description = "CI/CD: GitHub Actions runs, jobs and logs through the GitHub CLI, and what a ticket run's agent is told when its CI fails"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termf-core = { path = "../termf-core" }
termf-tickets = { path = "../termf-tickets" }
yaml-rust2 = "0.13.2"
