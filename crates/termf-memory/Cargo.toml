[package]
name = "termf-memory"
description = "The project memory: a local full-text index, per project, of its conversations, runs, library, docs, git history and artifacts, masked, that the project's expert searches"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termf-claude = { path = "../termf-claude" }
termf-core = { path = "../termf-core" }
