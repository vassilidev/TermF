[package]
name = "termf-ops"
description = "Ops: a project's connections (SSH, Postgres, MySQL, Kubernetes, cloud logs) and the recipes run through the system's own clients, bounded, masked and audited"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
# Already in the build (grep-regex): finds e-mails, phone numbers, IBANs and JWTs in an output.
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already in the build (the vault): a .env compared by the hashes of its values, never the values.
sha2 = "0.10.9"
# The SQL console's analysis (ARCHITECTURE §12.3), Apache-2.0: its visitor walks every nested query and statement.
# Without its default `recursive` stack growth: the parser's own depth limit stays.
sqlparser = { version = "0.64.0", default-features = false, features = ["std", "visitor"] }
termf-claude = { path = "../termf-claude" }
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-vault = { path = "../termf-vault" }
# The databases a repository declares, and database URLs, as its worktree setup reads them.
termf-worktree = { path = "../termf-worktree" }
toml = "1.2.2"
toml_edit = "0.25"
# Already in the build (the updater): an .xlsx export is a zip of XML parts, stored uncompressed.
zip = { version = "9.8.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# The DBA with the real Claude Code, in an ignored test.
termf-agents = { path = "../termf-agents" }
termf-core = { path = "../termf-core", features = ["test-util"] }
termf-sync = { path = "../termf-sync" }
