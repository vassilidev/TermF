[package]
name = "termf-ops"
description = "Ops: a project's connections (SSH, Postgres, MySQL, Kubernetes, cloud logs) and the recipes run through the system's own clients, bounded, masked and audited"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
# Already in the build (grep-regex): finds e-mails, phone numbers, IBANs and JWTs in an output.
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termf-claude = { path = "../termf-claude" }
termf-core = { path = "../termf-core" }
termf-library = { path = "../termf-library" }
termf-vault = { path = "../termf-vault" }
toml = "1.2.2"
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
termf-sync = { path = "../termf-sync" }
